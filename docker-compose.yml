---
services:
  umami:
    image: ghcr.io/umami-software/umami:latest
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://umami:umami@db:5432/umami
      # Generate with: openssl rand -hex 32
      APP_SECRET: ${APP_SECRET:?Set APP_SECRET in your .env file}
      # Required for two-factor authentication, generate with: openssl rand -hex 32
      TWO_FACTOR_ENCRYPTION_KEY: replace-me-with-a-64-character-hex-string
      # Optional: sign in through an OpenID Connect provider. Register the callback URL
      # https://<your-umami-host>/api/auth/callback/oidc with the provider.
      # OIDC_DISCOVERY_URL: https://idp.example.com/.well-known/openid-configuration
      # OIDC_CLIENT_ID: umami
      # OIDC_CLIENT_SECRET: replace-me
      # OIDC_PROVIDER_NAME: SSO
    depends_on:
      db:
        condition: service_healthy
    init: true
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "curl http://localhost:3000/api/heartbeat"]
      interval: 5s
      timeout: 5s
      retries: 5
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: umami
      POSTGRES_USER: umami
      POSTGRES_PASSWORD: umami
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
volumes:
  umami-db-data:
